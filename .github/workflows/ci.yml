name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # every OS/Python job reports independently
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check (stdlib only)
        run: python -m compileall -q config market_data exchange strategy execution risk portfolio backtest paper bot_logging metrics evaluation research scripts tests main.py
      - name: Full test suite
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python scripts/falcon.py --help
      - name: Package install smoke (wheel + installed CLI outside checkout)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          falcon --help
          python -c "import backtest, evaluation, research.campaign, research.store, scripts.falcon; print('imports ok')"
      - name: No-secrets scan
        shell: bash
        run: |
          test ! -f .env
          ! grep -RniE 'BEGIN [A-Z ]*PRIVATE KEY' --include='*.py' --include='*.md' .
